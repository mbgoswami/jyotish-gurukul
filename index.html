<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>📚 Jyotish Study Library</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div id="app">

        <!-- ========================= -->
        <!-- Header -->
        <!-- ========================= -->

        <!-- ========================= -->
        <!-- Main Layout -->
        <!-- ========================= -->

        <main id="mainLayout">

        <aside id="leftPanel">

    <div id="categorySearch">

    <input
        id="categorySearchInput"
        type="text"
        placeholder="🔍 Search Category"
        onkeyup="filterTree()">

    </div>

    <div id="categoryTitle">

        Categories

    </div>

    <div id="categoryList">

    </div>

</aside>


            <!-- RIGHT PANEL -->

            <section id="rightPanel">

    <div id="fileSearch">

    <input
        id="fileSearchInput"
        type="text"
        placeholder="🔍 Search File"
        onkeyup="searchFiles()">

</div>

    <div id="contentArea">

    <div id="viewerArea" style="display:none; height:100%;">
    <iframe
        id="fileViewer"
        style="
            width:100%;
            height:80vh;
            border:none;
            border-radius:8px;
            background:white;">
    </iframe>
    
    </div>

        <div id="welcomeBox">

            <h2>
                🙏 Welcome
            </h2>

            <br>

            <h3>
                📚 Jyotish Study Library
            </h3>

            <br>

            <p>

                Select a Category from the left panel.

            </p>

        </div>

    </div>


</section>

        </main>

    </div>

    <script src="app.js"></script>

</body>

</html>
